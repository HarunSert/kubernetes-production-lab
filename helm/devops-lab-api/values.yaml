replicaCount: 2

image:
  repository: harunsert/devops-lab-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: api.devops-lab.local

config:
  APP_NAME: devops-lab-api
  APP_ENV: lab
  APP_VERSION: "1.0.0"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
